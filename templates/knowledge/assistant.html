{% extends "admin/base_site.html" %}

{% block content %}
<div class="assistant-container" style="max-width: 800px; margin: 20px auto; font-family: sans-serif;">
    <div class="chat-header"
        style="background: #2d333b; color: white; padding: 20px; border-radius: 10px 10px 0 0; display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 24px;">🤖</span>
        <h2 style="margin: 0;">Asistente de Riesgos (RAG)</h2>
    </div>

    <div id="chat-box"
        style="height: 400px; overflow-y: auto; background: #f6f8fa; padding: 20px; border: 1px solid #d0d7de; display: flex; flex-direction: column; gap: 15px;">
        <div class="message system"
            style="background: #e6f6ff; padding: 10px; border-radius: 8px; font-size: 14px; color: #0969da;">
            ¡Hola! Soy tu asistente de RiskOps. Puedo ayudarte a analizar riesgos o consultar tus normativas cargadas.
            ¿En qué te ayudo hoy?
        </div>
    </div>

    <div class="chat-input-area"
        style="padding: 20px; background: white; border: 1px solid #d0d7de; border-top: none; border-radius: 0 0 10px 10px; display: flex; gap: 10px;">
        <input type="text" id="user-input" placeholder="Escribe tu consulta aquí..."
            style="flex: 1; padding: 12px; border: 1px solid #d0d7de; border-radius: 6px; outline: none;">
        <button id="send-btn"
            style="background: #2da44e; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold;">Enviar</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.style.padding = '10px';
        div.style.borderRadius = '8px';
        div.style.maxWidth = '80%';
        div.style.fontSize = '14px';

        if (type === 'user') {
            div.style.alignSelf = 'flex-end';
            div.style.background = '#2d333b';
            div.style.color = 'white';
        } else {
            div.style.alignSelf = 'flex-start';
            div.style.background = '#ffffff';
            div.style.border = '1px solid #d0d7de';
        }

        div.innerText = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const query = userInput.value.trim();
        if (!query) return;

        addMessage(query, 'user');
        userInput.value = '';

        // Typing indicator
        const loadingDiv = document.createElement('div');
        loadingDiv.innerText = "... pensando ...";
        loadingDiv.style.fontSize = '12px';
        loadingDiv.style.color = '#6e7781';
        chatBox.appendChild(loadingDiv);

        try {
            const response = await fetch('/knowledge/assistant/query/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                body: JSON.stringify({ query: query })
            });

            const data = await response.json();
            chatBox.removeChild(loadingDiv);

            if (data.response) {
                addMessage(data.response, 'ai');
            } else {
                addMessage("Hubo un error al procesar tu consulta.", 'ai');
            }
        } catch (e) {
            chatBox.removeChild(loadingDiv);
            addMessage("Error de conexión.", 'ai');
        }
    }

    sendBtn.onclick = sendMessage;
    userInput.onkeypress = (e) => { if (e.key === 'Enter') sendMessage(); };
</script>
{% endblock %}
